baseURL = 'https://forgiving.top/'
locale = 'zh-cn'
defaultContentLanguage = 'zh'
timeZone = 'Asia/Shanghai'
title = 'Forgiving'
theme = 'PaperMod'
enableRobotsTXT = true
enableGitInfo = true

[pagination]
  pagerSize = 10

[taxonomies]
  category = 'categories'
  tag = 'tags'

[menu]
  [[menu.main]]
    identifier = 'posts'
    name = '文章'
    url = '/posts/'
    weight = 10
  [[menu.main]]
    identifier = 'moments'
    name = '动态'
    url = '/moments/'
    weight = 15
  [[menu.main]]
    identifier = 'tags'
    name = '标签'
    url = '/tags/'
    weight = 20
  [[menu.main]]
    identifier = 'categories'
    name = '分类'
    url = '/categories/'
    weight = 30
  [[menu.main]]
    identifier = 'archives'
    name = '归档'
    url = '/archives/'
    weight = 40
  [[menu.main]]
    identifier = 'search'
    name = '搜索'
    url = '/search/'
    weight = 50
  [[menu.main]]
    identifier = 'gallery'
    name = '展馆'
    url = '/gallery/'
    weight = 55
  [[menu.main]]
    identifier = 'about'
    name = '关于'
    url = '/about/'
    weight = 60

[params]
  author = 'jian-in'
  avatar = 'https://pub-4d19ac99c083403ebd4ce5378906a944.r2.dev/%E5%B0%8F%E8%A1%A8%E6%83%85/blog_picture/20161231002739_BRzwL.jpeg'
  skills = ['Python', 'Markdown', 'Hugo', '学习笔记', '生活感悟']
  description = '这里记录我的学习笔记、技术分享和生活感悟。'
  defaultTheme = 'light'
  ShowCodeCopyButtons = true
  ShowShareButtons = true
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowToc = true
  TocOpen = true
  ShowWordCount = true
  UseHugoToc = true
  ShowRssButtonInSectionTermList = true
  ShowAllPagesInArchive = true
  ShowPageNums = true
  ShowFullTextinRSS = false
  hideFooter = false
  disableScrollToTop = false
  disableThemeToggle = false
  DateFormat = '2006-01-02'
  env = 'production'
  images = ['/images/forgiving-og.png']
  comments = true

  [params.assets]
    favicon = 'favicon.svg'
    favicon16x16 = 'favicon.svg'
    favicon32x32 = 'favicon.svg'
    apple_touch_icon = 'favicon.svg'
    safari_pinned_tab = 'favicon.svg'

  [params.search]
    enable = true
    contentLength = 4000
    placeholder = '搜索文章...'

  [params.editPost]
    URL = 'https://github.com/jian-in/jian-in.github.io/edit/master/content'
    Text = '编辑本文'
    appendFilePath = true

  [params.homeInfoParams]
    Title = '你好，欢迎来到 Forgiving'
    Content = '这里记录我的学习笔记、技术分享和生活感悟。'

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/jian-in'

  [[params.socialIcons]]
    name = 'email'
    url = 'mailto:1152417202@qq.com'

[params.cover]
  hidden = false
  hiddenInList = false
  hiddenInSingle = false

[minify]
  disableXML = true
  minifyOutput = true

[caches]
  [caches.images]
    dir = ':cacheDir/images'
    maxAge = '720h'
  [caches.assets]
    dir = ':resourceDir/_gen'
    maxAge = '720h'

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[markup]
  [markup.highlight]
    style = 'rrt'
    lineNos = true
    codeFences = true
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false
