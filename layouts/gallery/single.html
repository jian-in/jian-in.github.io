{{ define "main" }}
<div class="gallery-header">
  <h1 class="gallery-title">{{ .Title }}</h1>
  <p class="gallery-subtitle">随手贴在墙上的几张照片，点一下看大图</p>
</div>

<div class="gallery-grid">
  {{ range $index, $item := hugo.Data.gallery }}
  <button class="gallery-card" type="button" data-index="{{ $index }}"
          aria-label="查看图片：{{ $item.title }}"
          style="animation-delay: {{ mul $index 0.08 }}s">
    <div class="card-image-wrap">
      <img class="card-image" src="{{ $item.image }}" alt="{{ $item.title }}" loading="lazy">
    </div>
    {{ if or $item.title $item.desc }}
    <div class="card-info">
      {{ with $item.title }}<h3 class="card-title">{{ . }}</h3>{{ end }}
      {{ with $item.desc }}<p class="card-desc">{{ . }}</p>{{ end }}
    </div>
    {{ end }}
  </button>
  {{ end }}
</div>

{{ if not hugo.Data.gallery }}
<div class="gallery-empty">
  <p>墙上还空着。</p>
  <p>编辑 <code>data/gallery.yaml</code> 贴上第一张照片吧。</p>
</div>
{{ end }}

<!-- Lightbox -->
<div id="galleryLightbox"
     class="gallery-lightbox"
     role="dialog"
     aria-modal="true"
     aria-label="图片预览"
     aria-hidden="true"
     onclick="handleLightboxBackdrop(event)">
  <div class="lightbox-backdrop"></div>
  <div class="lightbox-content">
    <img id="lightboxImg" class="lightbox-img" src="" alt="">
    <div id="lightboxCaption" class="lightbox-info"></div>
  </div>
  <button class="lightbox-close" type="button" aria-label="关闭图片预览" onclick="closeLightbox()">&times;</button>
  <button class="lightbox-prev" type="button" aria-label="上一张图片" onclick="navLightbox(event, -1)">&#8249;</button>
  <button class="lightbox-next" type="button" aria-label="下一张图片" onclick="navLightbox(event, 1)">&#8250;</button>
</div>

<script>
document.querySelectorAll('.gallery-card').forEach(card => {
  card.addEventListener('click', () => openLightbox(parseInt(card.dataset.index, 10)));
});

/* ═══════════════════════════════════════════════
   Lightbox
   ═══════════════════════════════════════════════ */
const galleryData = {{ hugo.Data.gallery | jsonify | safeJS }};
let currentIndex = 0;
let lightboxReturnFocus = null;

function openLightbox(idx) {
  currentIndex = idx;
  const item = galleryData[idx];
  const lb = document.getElementById('galleryLightbox');
  const img = document.getElementById('lightboxImg');
  const cap = document.getElementById('lightboxCaption');
  if (!lb.classList.contains('active')) lightboxReturnFocus = document.activeElement;
  img.src = item.image;
  img.alt = item.title || '';
  cap.replaceChildren();
  if (item.title) {
    const title = document.createElement('h3');
    title.textContent = item.title;
    cap.appendChild(title);
  }
  if (item.desc) {
    const description = document.createElement('p');
    description.textContent = item.desc;
    cap.appendChild(description);
  }
  lb.classList.add('active');
  lb.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  lb.querySelector('.lightbox-close').focus();
}

function closeLightbox() {
  const lb = document.getElementById('galleryLightbox');
  if (!lb.classList.contains('active')) return;
  lb.classList.remove('active');
  lb.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
  if (lightboxReturnFocus) lightboxReturnFocus.focus();
}

function navLightbox(event, dir) {
  if (event) event.stopPropagation();
  currentIndex = (currentIndex + dir + galleryData.length) % galleryData.length;
  openLightbox(currentIndex);
}

function handleLightboxBackdrop(event) {
  if (event.target === event.currentTarget || event.target.classList.contains('lightbox-backdrop')) {
    closeLightbox();
  }
}

document.addEventListener('keydown', e => {
  const lb = document.getElementById('galleryLightbox');
  if (!lb.classList.contains('active')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') navLightbox(e, -1);
  if (e.key === 'ArrowRight') navLightbox(e, 1);
  if (e.key === 'Tab') {
    const controls = [...lb.querySelectorAll('button')];
    const first = controls[0];
    const last = controls[controls.length - 1];
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  }
});
</script>
{{ end }}
